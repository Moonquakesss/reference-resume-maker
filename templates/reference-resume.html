<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOCUMENT_TITLE}}</title>
<style>
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root {
    --accent: {{THEME_COLOR}};
    --accent-dark: {{THEME_DARK}};
    --text: #333333;
    --text-soft: #515151;
  }
  @page { size: A4; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body {
    font-family: "Noto Serif", "Noto Sans CJK SC", "Noto Sans", sans-serif;
    color: var(--text);
    font-size: {{BODY_FONT_SIZE}}px;
    line-height: {{BODY_LINE_HEIGHT}};
  }
  .page {
    width: 210mm;
    min-height: 297mm;
    padding: {{PAGE_PADDING}};
    background: #fff;
  }
  h1, h2, h3, p, ul, hr { margin: 0; }
  h1, .contact-block, .section-title, h3, p.section-education {
    font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif;
  }
  h1 {
    text-align: center;
    font-size: 25pt;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #151515;
    margin: 0 0 8px;
  }
  .contact-block {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 12px;
    padding: 0 0 10px;
    margin-bottom: 8px;
    border-bottom: 2px solid var(--accent);
    white-space: nowrap;
  }
  .contact-label {
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding-right: 12px;
    border-right: 1px solid #9aa7b3;
  }
  .contact-info {
    margin: 0;
    color: #3f3f3f;
    font-size: 12.8px;
    text-align: center;
  }
  .contact-info strong { color: #2d2d2d; font-weight: 700; }
  .section-title {
    color: var(--accent);
    font-size: 15px;
    line-height: 1.18;
    font-weight: 700;
    padding-bottom: 4px;
    margin: {{SECTION_MARGIN}};
    border-bottom: 1px solid var(--accent);
  }
  h3 {
    color: #2d2d2d;
    font-size: 13px;
    line-height: 1.32;
    font-weight: 700;
    margin: {{ENTRY_MARGIN}};
    break-after: avoid;
  }
  h3.section-projects {
    color: var(--accent);
    font-size: 13.2px;
    margin-top: {{PROJECT_TOP_GAP}};
  }
  p {
    color: var(--text-soft);
    margin: 0 0 {{PARAGRAPH_BOTTOM_GAP}};
    text-align: justify;
    text-justify: inter-ideograph;
    orphans: 2;
    widows: 2;
  }
  p.section-education { color: #333; line-height: 1.48; margin-bottom: 4px; }
  p.section-education strong { color: #202020; }
  p.section-work strong { color: var(--accent-dark); }
  ul {
    color: var(--text-soft);
    margin: {{LIST_MARGIN}};
    padding-left: 8px;
  }
  li {
    padding-left: 2px;
    margin-bottom: {{LIST_ITEM_GAP}};
    text-align: justify;
    text-justify: inter-ideograph;
  }
  li::marker { color: #313131; font-size: 0.72em; }
  p.section-projects strong, ul.section-projects strong {
    color: var(--accent);
    font-weight: 700;
  }
  hr { display: none; }
  @media screen {
    body { background: #eef1f4; }
    .page { margin: 18px auto; }
  }
  @media print { .page { margin: 0; } }
</style>
</head>
<body>
<main class="page">
{{CONTENT_HTML}}
</main>
</body>
</html>
